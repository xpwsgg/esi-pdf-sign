feature: 2026-05-20-pdf-sign
created: 2026-05-20

steps:
  - action: "工程骨架:建 Cargo workspace + crates/pdf-sign-core 空 lib + src-tauri 默认模板 + src 前端骨架(vanilla TS + Vite)"
    exit_signal: "cargo build 全绿,pnpm tauri dev 能打开空窗口"
    status: done

  - action: "编排骨架:core lib 实现 sign_pdf 但内部用 stub(直接复制原 PDF 加 _signed 后缀,不真贴图)"
    exit_signal: "单测 1 条 - 输入存在的 PDF,输出 _signed.pdf 文件存在"
    status: done

  - action: "计算节点(核心):lopdf 加载 PDF + 嵌入 PNG XObject + content stream 追加绘制指令,真实贴图到 Page 2 配置坐标"
    exit_signal: "单测 - 处理真实 H5P9 PDF,Preview 打开输出能看到签名图位于 ESI Engineer's Signature 上方"
    status: done

  - action: "批量 + 错误枚举:实现 sign_pdfs 串行循环 + SignError 4 分支 + SignResult 枚举"
    exit_signal: "单测覆盖 4 类错误(PDF 损坏 / 页码超界 / 图片损坏 / 写失败)"
    status: done

  - action: "Tauri 后端集成:注册 sign_pdfs_cmd command + 从 templates.toml 加载 spec + progress event 推送"
    exit_signal: "Tauri dev 模式下从前端 invoke 能拿到 Vec<SignResult> 结果"
    status: done

  - action: "前端 UI(静态结构 + 交互):index.html + main.ts 实现选 PDF / 选签名 / 签名按钮 / 进度列表 / 汇总显示"
    exit_signal: "Tauri 窗口里完整跑通'选PDF→选签名→签名→看汇总'流程"
    status: done

  - action: "持久化:接入 tauri-plugin-store 记 last_signature_path,启动时读、选签名后写"
    exit_signal: "重启应用后签名路径默认填上次选定值"
    status: done

  - action: "端到端验证:用真实 H5P9-五月.pdf + 张项签名跑完,Adobe Reader / Preview 打开输出确认视觉位置和不覆盖日期"
    exit_signal: "验收契约 S1~S8 所有场景通过"
    status: pending

