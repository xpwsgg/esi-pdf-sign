[workspace]
resolver = "2"
members = [
    "crates/pdf-sign-core",
    "src-tauri",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
