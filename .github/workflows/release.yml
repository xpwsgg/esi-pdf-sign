name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal .dmg)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --target universal-apple-darwin --bundles dmg
            artifact_glob: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name_template: esi-pdf-sign-{tag}-macos-universal.dmg
          - label: Windows portable (.exe)
            os: windows-latest
            rust_targets: ""
            build_args: --no-bundle
            artifact_glob: target/release/esi-pdf-sign.exe
            artifact_name_template: esi-pdf-sign-{tag}-windows-x64-portable.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate platform icons (.icns / .ico)
        run: pnpm tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.build_args }}

      - name: Stage artifact for release
        shell: bash
        run: |
          mkdir -p staging
          out_name=$(echo "${{ matrix.artifact_name_template }}" | sed "s/{tag}/${GITHUB_REF_NAME}/")
          src=$(ls ${{ matrix.artifact_glob }} | head -1)
          cp "$src" "staging/${out_name}"
          ls -la staging

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ESI PDF Sign ${{ github.ref_name }}
          body: |
            自动构建的 ESI 服务报告批量签名工具发布版。

            - **macOS** — `*-macos-universal.dmg`：Intel + Apple Silicon 通用 DMG 安装包。
            - **Windows** — `*-windows-x64-portable.exe`：**便携版，双击即用，无需安装**。
              依赖 WebView2 Runtime（Windows 11 默认已带；Windows 10 1803 及以上通常已带）。
          draft: false
          prerelease: false
          files: staging/*
