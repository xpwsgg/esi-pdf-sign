<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESI 服务报告批量签名</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>ESI 服务报告批量签名</h1>
      </header>

      <section class="card steps">
        <div class="step">
          <div class="step-head">
            <span class="step-index">1</span>
            <div class="step-text">
              <div class="step-title">选择 PDF 文件</div>
              <span id="pdf-summary" class="meta">尚未选择</span>
            </div>
          </div>
          <div class="step-actions">
            <button id="pick-pdf-single" class="btn btn-ghost">添加单个</button>
            <button id="pick-pdfs" class="btn btn-secondary">批量选择…</button>
          </div>
        </div>

        <div class="step">
          <div class="step-head">
            <span class="step-index">2</span>
            <div class="step-text">
              <div class="step-title">选择工程师签名图片</div>
              <span id="engineer-sig-path" class="meta">尚未选择</span>
            </div>
          </div>
          <div class="step-actions">
            <button id="clear-engineer-signature" class="btn btn-ghost" hidden>清空</button>
            <button id="pick-engineer-signature" class="btn btn-secondary">浏览图片…</button>
          </div>
        </div>

        <div class="step">
          <div class="step-head">
            <span class="step-index">3</span>
            <div class="step-text">
              <div class="step-title">选择客户签名图片（可选）</div>
              <span id="customer-sig-path" class="meta">尚未选择</span>
            </div>
          </div>
          <div class="step-actions">
            <button id="clear-customer-signature" class="btn btn-ghost" hidden>清空</button>
            <button id="pick-customer-signature" class="btn btn-secondary">浏览图片…</button>
          </div>
        </div>
        <div class="action-row">
          <button id="sign" class="btn btn-primary" disabled>开始签名</button>
          <label class="checkbox-label">
            <input type="checkbox" id="delete-source" class="checkbox" />
            <span>删除源文件（移至回收站）</span>
          </label>
          <span id="status" class="status"></span>
        </div>
      </section>

      <section id="worktime-section" class="card worktime" hidden>
        <div id="worktime-grand" class="wt-grand" hidden></div>
        <div id="worktime-body"></div>
      </section>

      <section id="results-section" class="card results" hidden>
        <h2>处理结果</h2>
        <ul id="results"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
